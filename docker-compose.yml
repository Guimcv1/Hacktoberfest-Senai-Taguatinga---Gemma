# Desenvolvimento local opcional. Não é um ambiente de produção.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: studybuddy
      POSTGRES_USER: studybuddy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studybuddy}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studybuddy -d studybuddy"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - studybuddy_pg:/var/lib/postgresql/data

volumes:
  studybuddy_pg:
