name: studybuddy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studybuddy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-studybuddy}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.11}
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-120s}
    volumes:
      - ollama:/root/.ollama
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}
      JWT_EXPIRES_MINUTES: ${JWT_EXPIRES_MINUTES:-480}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-studybuddy}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-studybuddy}
      DB_AUTO_MIGRATE: ${DB_AUTO_MIGRATE:-true}
      AI_BASE_URL: http://ollama:11434
      AI_MODEL: ${AI_MODEL:-gemma4:e4b}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-120}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-120s}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      DOCUMENT_STORAGE_DIR: /data/documents
      DOCUMENT_TTL_MINUTES: ${DOCUMENT_TTL_MINUTES:-10080}
      MAX_PDF_SIZE_MB: ${MAX_PDF_SIZE_MB:-10}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-50}
      MAX_STORED_DOCUMENTS: ${MAX_STORED_DOCUMENTS:-50}
      MAX_STORED_TEXT_CHARS: ${MAX_STORED_TEXT_CHARS:-2000000}
      MAX_CHAT_MESSAGE_CHARS: ${MAX_CHAT_MESSAGE_CHARS:-2000}
      MAX_RETRIEVAL_PAGES: ${MAX_RETRIEVAL_PAGES:-3}
      MAX_CONTEXT_CHARS: ${MAX_CONTEXT_CHARS:-6000}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-20}
    volumes:
      - documents:/data/documents
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)",
        ]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 10s

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
  documents:
  ollama:
